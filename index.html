function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

/* ====== MTF DETECTOR & RENDERER ====== */
function isMTF(text){
  return text.includes('List I:') && text.includes('List II:');
}

function parseMTFForDisplay(text){
  // Extract title (first line before \n\n)
  const lines = text.split('\n');
  let title='', header='', l1items=[], l2items=[], choose='';
  let section='title';
  for(let i=0;i<lines.length;i++){
    const line=lines[i].trim();
    if(!line) continue;
    if(line==='List I:'){section='l1';continue;}
    if(line==='List II:'){section='l2';continue;}
    if(line.startsWith('Choose')){choose=line;continue;}
    if(section==='title'){
      if(line.startsWith('Match List')){title=line;}
      else if(title){header=(header?header+' ':'')+line;}
    }
    if(section==='l1') l1items.push(line);
    if(section==='l2') l2items.push(line);
  }
  return {title,header,l1items,l2items,choose};
}

function renderMTF(text){
  const {title,header,l1items,l2items,choose}=parseMTFForDisplay(text);
  const maxRows=Math.max(l1items.length,l2items.length);
  let rows='';
  for(let i=0;i<maxRows;i++){
    const item1=l1items[i]||'';
    const item2=l2items[i]||'';
    // Split "A. text" and "I. text"
    const m1=item1.match(/^([A-D])\.\s*(.*)/s);
    const m2=item2.match(/^([IVX]+)\.\s*(.*)/s);
    const k1=m1?m1[1]:'', v1=m1?m1[2]:item1;
    const k2=m2?m2[1]:'', v2=m2?m2[2]:item2;
    rows+=`<tr>
      <td class="col-key">${esc(k1)}</td>
      <td class="col-list1">${esc(v1)}</td>
      <td class="col-roman">${esc(k2)}</td>
      <td class="col-list2">${esc(v2)}</td>
    </tr>`;
  }
  return `<div class="mtf-wrap">
    <div class="mtf-title">📋 ${esc(title||'Match List I with List II')}</div>
    ${header?`<div class="mtf-header">${esc(header)}</div>`:''}
    <div style="overflow-x:auto;-webkit-overflow-scrolling:touch"><table class="mtf-table">
      <thead><tr>
        <th></th><th>List I</th>
        <th></th><th>List II</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    ${choose?`<div class="mtf-choose">${esc(choose)}</div>`:''}
  </div>`;
}

/* ====== HOME SCREEN ====== */
function showHome(){
  activePaper=null;started=false;clearInterval(timer);clock.hidden=true;
  brandTitle.textContent="AIAPGET Mock Test";
  brandSub.textContent="All India AYUSH Post Graduate Entrance Test - Homoeopathy";
  navDuration.textContent="Duration: —";navMarks.textContent="Total Marks: —";
  let cards=Object.entries(PAPERS).sort((a,b)=>b[0]-a[0]).map(([yr,c])=>{
    const tm=c.totalQ*c.perQ;
    return `<div class="year-card" onclick="selectPaper('${yr}')">
      <span class="badge">${c.totalQ} Questions</span>
      <div class="yr">${yr}</div>
      <div class="meta">
        <b>${esc(c.title)}</b><br>${esc(c.subtitle)}<br>
        Duration: <b>${c.duration} min</b> | Total: <b>${tm} marks</b><br>
        Marking: <b>+${c.perQ}</b> correct, <b>−${c.negMark}</b> wrong
        ${c.note?`<br><span class="drop-note">⚠ ${esc(c.note)}</span>`:''}
      </div>
      <span class="start-btn">Start Mock Test →</span>
    </div>`;
  }).join('');
  app.innerHTML=`<div class="home"><div class="home-header"><h1>AIAPGET Online Mock Tests</h1><p>Select a year to start your CBT practice test</p></div><div class="year-grid">${cards}</div></div>`;
}

/* ====== SELECT PAPER ====== */
function selectPaper(yr){
  activePaper=yr;conf=PAPERS[yr];Q=conf.questions;key=conf.key;
  current=0;answers={};marks={};started=false;seconds=conf.duration*60;
  clearInterval(timer);clock.hidden=true;
  brandTitle.textContent=conf.title;brandSub.textContent=conf.subtitle;
  navDuration.textContent="Duration: "+conf.duration+" Minutes";
  navMarks.textContent="Total Marks: "+(conf.totalQ*conf.perQ);
  showInstructions();
}

/* ====== INSTRUCTIONS ====== */
function showInstructions(){
  const tm=conf.totalQ*conf.perQ;
  app.innerHTML=`<section class="start">
    <span class="back-link" onclick="showHome()">← Back to Paper Selection</span>
    <h1>${esc(conf.title)} Online Test</h1>
    <p>Homoeopathy — ${conf.totalQ} Questions — ${tm} Marks</p>
    <div class="rules"><b>Instructions</b><br>
      1. Duration: <b>${conf.duration} minutes</b>. Timer starts after you click Start.<br>
      2. Correct: <b>+${conf.perQ}</b>. Wrong: <b>−${conf.negMark}</b>. Unattempted: 0.<br>
      3. Save, clear, or mark questions for review before submitting.<br>
      4. Match-the-following questions display as structured tables for clarity.<br>
      5. Click question numbers in the palette to jump to any question.
      ${conf.note?`<br><span style="color:#9a6400">⚠ ${esc(conf.note)}</span>`:''}
    </div>
    <button class="btn blue" style="font-size:16px;padding:14px 36px" onclick="startTest()">Start Test</button>
  </section>`;
}

/* ====== START ====== */
function startTest(){started=true;clock.hidden=false;timer=setInterval(tick,1000);tick();renderTest()}
function tick(){
  let m=Math.floor(seconds/60),s=seconds%60;
  clock.querySelector("span").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  if(seconds<=0)finish();else seconds--;
}
function state(x){return marks[x]?"marked":answers[x]?"answered":""}

/* ====== RENDER TEST ====== */
function renderTest(){
  const q=Q[current];
  const nums=Q.map((x,j)=>`<button class="num ${state(j)}${j===current?" current":""}" onclick="jump(${j})">${j+1}</button>`).join('');
  const answered=Object.keys(answers).length, markedC=Object.keys(marks).length;
  const m=META[q.id]||{};

  // Question body: MTF table or regular text
  let qBody;
  if(isMTF(q.text)){
    qBody=renderMTF(q.text);
  } else {
    qBody=`<div class="question-text">${esc(q.text)}</div>`;
  }

  // Options — MTF options use monospace alignment
  const optHtml=q.options.map((label,n)=>`
    <button class="option ${answers[current]===n+1?"selected":""}" onclick="choose(${n+1})">
      <span class="choiceNo">${n+1}</span>
      <span class="option-text">${esc(label)}</span>
    </button>`).join('');

  app.innerHTML=`<div class="layout">
    <section class="card">
      <div class="question-title">
        <span>Question No. ${q.number}</span>
        <span>ID: ${q.id} | Marks: ${conf.perQ}.00${m.s?' | '+esc(m.s):''}</span>
      </div>
      <div class="body">
        ${qBody}
        <div class="answers">${optHtml}</div>
      </div>
      <div class="actions">
        <button class="btn gray" onclick="clearAnswer()">Clear Response</button>
        <button class="btn orange" onclick="markReview()">Mark for Review & Next</button>
        <button class="btn green" onclick="saveNext()">Save & Next</button>
      </div>
    </section>
    <button class="palette-fab no-print" onclick="openPalette()" aria-label="Open question palette">
      ☰ Palette <span class="fab-badge">${current+1}/${Q.length}</span>
    </button>
    <div class="palette-backdrop no-print" id="paletteBackdrop" onclick="closePalette()"></div>
    <aside class="card side" id="paletteAside">
      <div class="side-head">Question Palette<button class="palette-close no-print" onclick="closePalette()" aria-label="Close palette">✕</button></div>
      <div class="candidate"><span class="avatar">C</span>
        <div><b>Mock Candidate</b><br><small style="color:#52606d">${esc(conf.title)}</small></div>
      </div>
      <div class="legend">
        <span><span class="leg-box" style="background:#14833b"></span> Answered (${answered})</span>
        <span><span class="leg-box" style="background:#784398"></span> Marked (${markedC})</span>
        <span><span class="leg-box" style="background:#e9edf1;border:1px solid #ccc"></span> Not visited</span>
        <span><span class="leg-box" style="background:#fff;border:3px solid #e87925"></span> Current</span>
      </div>
      <div class="palette"><b>Homoeopathy</b><div class="numbers">${nums}</div></div>
      <button class="btn red submit" onclick="confirmSubmit()">Submit Test</button>
    </aside>
  </div>`;
  document.body.style.overflow='';
}

/* ====== MOBILE PALETTE OVERLAY ====== */
function openPalette(){
  document.getElementById('paletteAside')?.classList.add('open');
  document.getElementById('paletteBackdrop')?.classList.add('open');
  document.body.style.overflow='hidden';
}
function closePalette(){
  document.getElementById('paletteAside')?.classList.remove('open');
  document.getElementById('paletteBackdrop')?.classList.remove('open');
  document.body.style.overflow='';
}

/* ====== ACTIONS ====== */
function choose(n){answers[current]=n;delete marks[current];renderTest()}
function clearAnswer(){delete answers[current];delete marks[current];renderTest()}
function saveNext(){if(current<Q.length-1)current++;renderTest();window.scrollTo(0,0)}
function markReview(){marks[current]=true;if(current<Q.length-1)current++;renderTest();window.scrollTo(0,0)}
function jump(n){current=n;renderTest();window.scrollTo(0,0)}
function confirmSubmit(){if(confirm("Are you sure you want to submit?"))finish()}

/* ====== FINISH & RESULTS ====== */
function finish(){
  clearInterval(timer);clock.hidden=true;
  let correct=0,wrong=0,unattempted=0,bonus=0;
  const totalMarks=conf.totalQ*conf.perQ;
  const subjs={};

  Q.forEach((q,i)=>{
    const m=META[q.id]||{s:"General"};
    const s=m.s||"General";
    if(!subjs[s])subjs[s]={total:0,correct:0,wrong:0,unattempted:0,wrongQs:[]};
    subjs[s].total++;
    if(key[q.id]==="Drop"){bonus+=conf.perQ;subjs[s].correct++;}
    else if(!answers[i]){unattempted++;subjs[s].unattempted++;}
    else if(answers[i]===key[q.id]){correct++;subjs[s].correct++;}
    else{wrong++;subjs[s].wrong++;subjs[s].wrongQs.push(q.number);}
  });

  const score=correct*conf.perQ-wrong*conf.negMark+bonus;

  // Build result rows with MTF-friendly correct answer display
  const rows=Q.map((q,i)=>{
    const k=key[q.id],a=answers[i],m=META[q.id]||{s:"",e:""};
    const aText=a?q.options[a-1]:"Not attempted";
    const kText=k==="Drop"?"Dropped":q.options[k-1];
    const label=k==="Drop"?"Dropped +"+conf.perQ:!a?"Not attempted":a===k?"Correct (+"+conf.perQ+")":"Wrong (−"+conf.negMark+")";
    const cl=k==="Drop"?"drop":!a?"":a===k?"good":"bad";
    const explHtml=m.e?`<div class="expl">💡 ${esc(m.e)}</div>`:"";
    return `<tr>
      <td>${q.number}</td><td>${q.id}</td><td>${esc(m.s||"")}</td>
      <td>${a||"—"}</td><td>${esc(aText)}</td>
      <td>${k==="Drop"?"Drop":k}</td>
      <td>${esc(kText)}${explHtml}</td>
      <td class="${cl}">${label}</td>
    </tr>`;
  }).join('');

  // Subject analysis
  const subjSorted=Object.entries(subjs).sort((a,b)=>{
    const accA=(a[1].correct+a[1].wrong)>0?a[1].correct/(a[1].correct+a[1].wrong):0;
    const accB=(b[1].correct+b[1].wrong)>0?b[1].correct/(b[1].correct+b[1].wrong):0;
    return accB-accA;
  });

  const subjCards=subjSorted.map(([name,d])=>{
    const att=d.correct+d.wrong, acc=att>0?Math.round(d.correct/att*100):0;
    const fc=acc>=65?"#14833b":acc>=45?"#e6a700":"#c5221f";
    const vd=acc>=65?"🟢 Strong":acc>=45?"🟡 Needs Work":"🔴 Critical";
    const nm=d.correct*conf.perQ-d.wrong*conf.negMark;
    return `<div class="subj-card">
      <div class="sn">${esc(name)}</div>
      <div class="ss">${d.total} Qs • ${d.correct}✓ ${d.wrong}✗ ${d.unattempted} skip • Net: ${nm>=0?"+":""}${nm}</div>
      <div class="sb"><div class="sf" style="width:${acc}%;background:${fc}"></div></div>
      <div class="sv" style="color:${fc}">${vd} (${acc}%)</div>
      ${d.wrongQs.length?`<div style="font-size:10px;color:#888;margin-top:3px">Wrong: Q${d.wrongQs.slice(0,10).join(', Q')}${d.wrongQs.length>10?'…':''}</div>`:''}
    </div>`;
  }).join('');

  const subjTable=subjSorted.map(([name,d])=>{
    const att=d.correct+d.wrong, acc=att>0?Math.round(d.correct/att*100):0;
    const nm=d.correct*conf.perQ-d.wrong*conf.negMark;
    const cl=acc>=65?"good":acc<40?"bad":"";
    return `<tr><td><b>${esc(name)}</b></td><td>${d.total}</td><td>${d.correct}</td><td>${d.wrong}</td><td>${d.unattempted}</td><td class="${cl}"><b>${acc}%</b></td><td>${nm>=0?"+":""}${nm}</td></tr>`;
  }).join('');

  const accuracy=Math.round(correct/(correct+wrong)*100)||0;
  const strengths=subjSorted.filter(([,d])=>{const a=(d.correct+d.wrong)>0?d.correct/(d.correct+d.wrong):0;return a>=0.65;});
  const weaknesses=subjSorted.filter(([,d])=>{const a=(d.correct+d.wrong)>0?d.correct/(d.correct+d.wrong):0;return a<0.40;});
  const moderate=subjSorted.filter(([,d])=>{const a=(d.correct+d.wrong)>0?d.correct/(d.correct+d.wrong):0;return a>=0.40&&a<0.65;});

  let swHtml='';
  if(strengths.length) swHtml+=`<div class="sw-box sw-g"><b style="color:#137333">✅ Strengths (65%+ accuracy)</b><br>${strengths.map(([n,d])=>{const acc=Math.round(d.correct/(d.correct+d.wrong)*100);return `• <b>${esc(n)}</b> (${acc}%) — ${d.correct}/${d.total} correct`;}).join('<br>')}<div style="font-size:11px;margin-top:4px;color:#137333">Great work — maintain these scores!</div></div>`;
  if(weaknesses.length) swHtml+=`<div class="sw-box sw-r"><b style="color:#c5221f">❌ Weaknesses (below 40%)</b><br>${weaknesses.map(([n,d])=>{const acc=d.correct+d.wrong>0?Math.round(d.correct/(d.correct+d.wrong)*100):0;return `• <b>${esc(n)}</b> (${acc}%) — only ${d.correct} correct from ${d.correct+d.wrong} attempted`;}).join('<br>')}<div style="font-size:11px;margin-top:4px;color:#c5221f">Focus maximum study time here — biggest mark potential!</div></div>`;
  if(moderate.length) swHtml+=`<div class="sw-box sw-y"><b style="color:#b06000">⚠️ Moderate (40–64%)</b><br>${moderate.map(([n,d])=>{const acc=Math.round(d.correct/(d.correct+d.wrong)*100);return `• <b>${esc(n)}</b> (${acc}%)`;}).join('<br>')}<div style="font-size:11px;margin-top:4px;color:#b06000">A few hours of revision can push these into the strong zone.</div></div>`;

  const insightHtml=`<div class="sw-box sw-y"><b>💡 Key Insights</b><br>
    • Accuracy: <b>${accuracy}%</b> — ${accuracy>=65?"Good! Keep it up.":accuracy>=50?"Borderline — reduce guessing.":"Too low — you're guessing too much."}<br>
    • Marks lost to wrong answers: <b>−${wrong*conf.negMark}</b>. If you had skipped those, score = <b>${correct*conf.perQ+bonus}</b> (+${wrong*conf.negMark} more).<br>
    • Unattempted: <b>${unattempted}</b> questions.<br>
    • Target for 250+: ~70 correct with ≤15 wrong. Currently: ${correct} correct, ${wrong} wrong.
  </div>`;

  let topicHtml=`<h3>📚 Topics to Focus On</h3><div class="topic-list">`;
  weaknesses.concat(moderate.filter(([,d])=>{const a=d.correct+d.wrong>0?d.correct/(d.correct+d.wrong):0;return a<0.50;})).forEach(([n])=>{
    topicHtml+=`<span class="topic-tag weak">${esc(n)}</span>`;
  });
  strengths.forEach(([n])=>{topicHtml+=`<span class="topic-tag">${esc(n)} ✓</span>`;});
  topicHtml+='</div>';

  app.innerHTML=`<section class="result" id="resultSection">
    <div class="no-print" style="float:right;display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
      <button class="btn purple" onclick="downloadPDF()" style="font-size:13px;padding:10px 18px">📥 Download PDF</button>
      <button class="btn green" onclick="showHome()" style="font-size:13px;padding:10px 18px">← All Papers</button>
    </div>
    <h2>Test Submitted — ${esc(conf.title)}</h2>
    ${conf.note?`<p style="font-size:12px;color:#9a6400;margin-bottom:8px">⚠ ${esc(conf.note)}</p>`:''}
    <div class="metrics">
      <div class="metric">Score<b>${score} / ${totalMarks}</b></div>
      <div class="metric">Correct<b>${correct}</b></div>
      <div class="metric">Wrong<b>${wrong}</b></div>
      <div class="metric">Unattempted<b>${unattempted}</b></div>
    </div>
    <h3>Question-wise Analysis</h3>
    <div style="overflow-x:auto;-webkit-overflow-scrolling:touch"><table class="rtable">
      <tr><th>Q#</th><th>ID</th><th>Subject</th><th>Ans</th><th>Your Answer</th><th>Key</th><th>Correct Answer & Explanation</th><th>Result</th></tr>
      ${rows}
    </table></div>
    <div class="analysis-section">
      <h2 style="border:none;margin-top:0">📊 Performance Analysis</h2>
      ${insightHtml}
      <h3>Subject-wise Breakdown</h3>
      <div class="subj-grid">${subjCards}</div>
      <div style="overflow-x:auto;-webkit-overflow-scrolling:touch"><table class="rtable">
        <tr><th>Subject</th><th>Qs</th><th>✓</th><th>✗</th><th>Skip</th><th>Accuracy</th><th>Net Marks</th></tr>
        ${subjTable}
        <tr style="background:#f0f2f5;font-weight:700"><td>TOTAL</td><td>${conf.totalQ}</td><td>${correct}</td><td>${wrong}</td><td>${unattempted}</td><td>${accuracy}%</td><td>${score>=0?"+":""}${score}</td></tr>
      </table></div>
      <h3>✅ Strengths & ❌ Weaknesses</h3>${swHtml}
      ${topicHtml}
    </div>
    <p class="no-print" style="margin-top:20px;text-align:center">
      <button class="btn purple" onclick="downloadPDF()" style="font-size:14px;padding:12px 26px;margin-right:10px">📥 Download Scorecard + Analysis as PDF</button>
      <button class="btn blue" onclick="selectPaper('${activePaper}')" style="font-size:14px;padding:12px 26px;margin-right:10px">Retry This Paper</button>
      <button class="btn green" onclick="showHome()" style="font-size:14px;padding:12px 26px">← All Papers</button>
    </p>
  </section>`;
  window.scrollTo(0,0);
}

function downloadPDF(){window.print()}
showHome();
</script></body></html>
